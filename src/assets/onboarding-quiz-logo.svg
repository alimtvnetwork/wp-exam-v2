<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="oq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="oq-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="oq-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="oq-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="oq-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="oq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container with subtle gradient border -->
  <rect width="48" height="48" rx="12" fill="url(#oq-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="url(#oq-border)" stroke-width="1.5"/>

  <!-- Quiz Form Sheet with Crisp Glassmorphic Depth -->
  <rect x="10" y="8" width="22" height="28" rx="4" fill="#1E293B" stroke="url(#oq-cyan)" stroke-width="1.2" filter="url(#oq-glow)"/>
  
  <!-- Sheet Header Accent Line -->
  <path d="M14 13h14" stroke="url(#oq-cyan)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Form Question Lines -->
  <path d="M14 18h11M14 22h8" stroke="url(#oq-purple)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
  
  <!-- Typographic "Q" Brand Mark on the Sheet -->
  <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="url(#oq-cyan)" letter-spacing="-0.2">Q</text>
  <circle cx="21" cy="30" r="1.2" fill="#34D399"/>

  <!-- Top Right Sparkle / Magic Accent (Cyan-to-Purple) -->
  <path d="M37 10c0 2-2 3-2 3s2 1 2 3c0-2 2-3 2-3s-2-1-2-3z" fill="url(#oq-cyan)"/>

  <!-- Floating Verified Emerald Success Badge with Checkmark -->
  <circle cx="34" cy="32" r="9" fill="url(#oq-emerald)" stroke="#0F172A" stroke-width="2.5" filter="url(#oq-glow)"/>
  <path d="M30 32l2.8 2.8 5.6-5.8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
